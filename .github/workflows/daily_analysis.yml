name: Daily Update

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 07:00 Sofia time
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate API keys
        env:
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          ODDS_API_KEY:            ${{ secrets.ODDS_API_KEY }}
          OAIO_API_KEY:            ${{ secrets.OAIO_API_KEY }}
          FOOTBALL_DATA_API_KEY:   ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY:        ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'EOF'
          import os, sys, urllib.request, json
          errors = []

          def check(name, url, headers=None, expect_key=None):
              req = urllib.request.Request(url, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=8) as r:
                      if r.status == 200:
                          print(f"  ✓  {name}")
                          return
                      errors.append(f"{name}: HTTP {r.status}")
              except Exception as e:
                  code = getattr(getattr(e, 'code', None), '__int__', lambda: None)()
                  if code == 401 or "401" in str(e):
                      errors.append(f"{name}: 401 Unauthorized — key invalid or expired")
                  else:
                      errors.append(f"{name}: {e}")

          groq_key  = os.environ.get("GROQ_API_KEY", "")
          odds_key  = os.environ.get("ODDS_API_KEY", "")
          oaio_key  = os.environ.get("OAIO_API_KEY", "")
          fd_key    = os.environ.get("FOOTBALL_DATA_API_KEY", "")
          af_key    = os.environ.get("API_FOOTBALL_KEY", "")

          print("\n🔑 API key validation\n")
          if groq_key:
              # /models returns 403 on free-tier keys; treat 200 or 403 as valid
              req2 = urllib.request.Request(
                  "https://api.groq.com/openai/v1/models",
                  headers={"Authorization": f"Bearer {groq_key}"})
              try:
                  with urllib.request.urlopen(req2, timeout=8) as r:
                      print(f"  ✓  GROQ_API_KEY (Groq)")
              except Exception as e:
                  code = getattr(e, 'code', None)
                  if code == 403:
                      print(f"  ✓  GROQ_API_KEY (Groq) — key valid (403 on /models is expected)")
                  elif code == 401 or "401" in str(e):
                      errors.append("GROQ_API_KEY (Groq): 401 Unauthorized — key invalid or expired")
                  else:
                      errors.append(f"GROQ_API_KEY (Groq): {e}")
          else:
              errors.append("GROQ_API_KEY: not set")

          if odds_key:
              check("ODDS_API_KEY (the-odds-api.com)",
                    f"https://api.the-odds-api.com/v4/sports/?apiKey={odds_key}")
          else:
              errors.append("ODDS_API_KEY: not set")

          if oaio_key:
              check("OAIO_API_KEY (odds-api.io)",
                    f"https://api.odds-api.io/v3/leagues?sport=football&apiKey={oaio_key}")
          else:
              errors.append("OAIO_API_KEY: not set")

          if fd_key:
              check("FOOTBALL_DATA_API_KEY (football-data.org)",
                    "https://api.football-data.org/v4/competitions/",
                    {"X-Auth-Token": fd_key})
          else:
              errors.append("FOOTBALL_DATA_API_KEY: not set")

          if af_key:
              check("API_FOOTBALL_KEY (api-football.com)",
                    "https://v3.football.api-sports.io/status",
                    {"x-apisports-key": af_key})
          else:
              errors.append("API_FOOTBALL_KEY: not set")

          if errors:
              print("\n⚠️  Key issues detected:")
              for e in errors: print(f"    ✗  {e}")
              print()
          else:
              print("\n✅  All keys valid\n")
          EOF

      - name: Check match results
        continue-on-error: true
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python fetch_results.py

      - name: Generate AI analysis (Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate_analysis.py

      - name: Refresh live odds (William Hill)
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # the-odds-api.com (EPL)
          OAIO_API_KEY: ${{ secrets.OAIO_API_KEY }}   # odds-api.io (UEFA + expansion)
        run: python fetch_odds.py

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matchday.json data/live_odds.json
          git diff --cached --quiet || git commit -m "chore: daily update [$(date +%Y-%m-%d)]"
          git pull --rebase
          git push
